<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<title>Morse Learner</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="flash"></div>
<header><h1>Morse Learner</h1><div id="stats"></div><button id="settingsBtn" aria-label="Settings">⚙️</button></header>
<main id="app"></main>
<dialog id="settings">
  <h2>Signals</h2>
  <label><input type="checkbox" id="optSound"> Sound</label>
  <label><input type="checkbox" id="optLight"> Screen light</label>
  <label><input type="checkbox" id="optVibration"> Vibration <small id="vibNote"></small></label>
  <label>Speed <input type="range" id="optSpeed" min="0.5" max="2" step="0.25"></label>
  <label>Pitch <input type="range" id="optPitch" min="400" max="900" step="50"></label>
  <button id="closeSettings">Done</button>
</dialog>
<script src="morse.js"></script>
<script src="app.js"></script>
</body>
</html>
